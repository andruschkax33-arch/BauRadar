name: BauRadar Sammeljob

on:
  schedule:
    # GitHub kennt nur UTC. 4:00 UTC = 6:00 Uhr in Berlin (Sommerzeit),
    # 5:00 UTC = 6:00 Uhr in Berlin (Winterzeit). Der Schritt "gate" lässt nur den passenden Lauf durch.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: bauradar-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Nur um 6 Uhr deutscher Zeit laufen
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "06" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python einrichten
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        if: steps.gate.outputs.run == 'true'
        run: pip install pyyaml

      - name: Sammeljob ausführen
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/collect.py

      - name: Ergebnis speichern
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "BauRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/items.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Tägliche Aktualisierung der Meldungen"
            git push
          fi
